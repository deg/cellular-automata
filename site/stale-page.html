<script>
  // Inserted by site/build.sh near the top of every demo page, straight after <meta charset>,
  // before trunk's script that loads the demo. Each deploy gives a demo's .js, .mjs and
  // .wasm new names (they carry a hash of their contents) and deletes the old ones, and
  // GitHub Pages lets browsers reuse a page for 10 minutes. A page cached from before a
  // deploy would ask for files that are gone, and sit on "Loading…". So if one of the page's
  // own .js, .mjs or .wasm files fails to load, reload once: a reload checks the page with
  // the server, and gets the new one. The flag stops a second reload in a row, should the
  // new page fail too.
  (function () {
    var key = "stale-page-reloaded:" + location.pathname;
    var started = false; // after this, a failing script is someone else's: leave it alone
    function remember(value) {
      try {
        if (value) sessionStorage.setItem(key, "1"); else sessionStorage.removeItem(key);
        return true;
      } catch (e) {
        return false; // no storage: don't risk reloading for ever
      }
    }
    function reloadedAlready() {
      try { return sessionStorage.getItem(key) !== null; } catch (e) { return true; }
    }
    addEventListener("error", function (event) {
      if (started) return;
      var element = event.target;
      var url = element && (element.src || element.href);
      if (url && /\.(m?js|wasm)(\?|$)/.test(url) && !reloadedAlready() && remember(true)) {
        location.reload();
      }
    }, true); // load errors don't bubble: listen as they go down
    addEventListener("TrunkApplicationStarted", function () {
      started = true;
      remember(false);
    });
  })();
</script>
