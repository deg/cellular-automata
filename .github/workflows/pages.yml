# Build every demo for the web and publish them, with the index page, to GitHub Pages:
# https://automata.degel.com/
# Runs on every push to main, and by hand from the Actions tab.
name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a run still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: v0.22.1
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The prebuilt binary, checked against its published checksum, is much faster than
      # `cargo install trunk`.
      - name: Install trunk
        run: |
          base="https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}"
          file="trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "${base}/${file}"
          curl -sSLO "${base}/${file}.sha256"
          # The .sha256 file holds only the hash; sha256sum -c wants "hash  filename".
          echo "$(cut -d" " -f1 "${file}.sha256")  ${file}" | sha256sum -c -
          tar -xzf "${file}" -C "${HOME}/.cargo/bin"
          trunk --version

      - name: Build every demo and the index page
        run: site/build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
