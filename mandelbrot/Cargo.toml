[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"
description = "Repeat z → z² + c and see which points stay near 0: the most famous fractal, step by step and zoomable."

[dependencies]
ca_core = { path = "../ca_core" }
# std::time::Instant panics in the browser; this is the same, there and natively. eframe
# already depends on it.
web-time = "1.1"
