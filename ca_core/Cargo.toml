[package]
name = "ca_core"
version = "0.1.0"
edition = "2024"
description = "Shared grid, rendering, controls and entry point for the cellular-automata demos"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
